[project]
name = "zayavochka"
version = "0.1.0"
description = "Заявочка — Telegram-бот приёма заявок от музыкальных групп для концертных площадок"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zayavochka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
